# Gitleaks configuration. Extends the default rules.
#
# The two allowlisted JWTs below are the Supabase CLI's PUBLIC local-development
# demo keys ("supabase-demo" issuer), identical for every `supabase start` on
# every machine and published in Supabase's documentation. They are not secrets.
# Real project keys must never be committed and are NOT allowlisted.

[extend]
useDefault = true

[allowlist]
description = "Supabase CLI public local demo keys (issuer supabase-demo)"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0\.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU''',
]
