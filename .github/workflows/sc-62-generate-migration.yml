name: SC-62 generate Drizzle revision migration (temporary)
on:
  pull_request:
    paths:
      - 'packages/database/src/schema/tutors/tutor-application-v2-revisions.ts'
      - 'packages/database/src/schema/index.ts'
      - '.github/workflows/sc-62-generate-migration.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-62/tutor-application-v2-foundation
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studdy/database db:generate
      - name: Commit generated Drizzle SQL and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/migrations/generated/
          if ! git diff --cached --quiet; then
            git commit -m "db: generate v2 submission revision migration [sc-62]"
            git push origin HEAD:sc-62/tutor-application-v2-foundation
          fi
