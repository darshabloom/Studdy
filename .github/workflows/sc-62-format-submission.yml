name: SC-62 format approved submission slice (temporary)
on:
  pull_request:
    paths:
      - 'packages/domain/src/tutors/application-v2-submission.ts'
      - 'packages/domain/src/tutors/application-v2-submission.test.ts'
      - 'packages/database/src/repositories/tutor-application-v2-submission.ts'
      - 'packages/database/src/schema/tutors/tutor-application-v2-revisions.ts'
      - 'apps/web/src/components/tutors/application-v2-wizard.tsx'
      - '.github/workflows/sc-62-format-submission.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-62/tutor-application-v2-foundation
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/tutors/application-v2-wizard.tsx packages/database/src/repositories/tutor-application-v2-submission.ts packages/database/src/schema/tutors/tutor-application-v2-revisions.ts packages/domain/src/tutors/application-v2-submission.test.ts packages/domain/src/tutors/application-v2-submission.ts
      - name: Commit exact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/tutors/application-v2-wizard.tsx packages/database/src/repositories/tutor-application-v2-submission.ts packages/database/src/schema/tutors/tutor-application-v2-revisions.ts packages/domain/src/tutors/application-v2-submission.test.ts packages/domain/src/tutors/application-v2-submission.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository formatting to v2 submission slice [sc-62]"
            git push origin HEAD:sc-62/tutor-application-v2-foundation
          fi
