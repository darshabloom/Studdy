name: Format Studdy public release
on:
  push:
    branches:
      - release/studdy-approved-public-brand-20261124
    paths:
      - .github/workflows/format-studdy-public-release.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/studdy-approved-public-brand-20261124
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format four changed source files
        run: |
          pnpm exec prettier --write "apps/web/src/app/(public)/page.tsx" "apps/web/src/app/(public)/layout.tsx" apps/web/src/components/layout/public-nav.tsx apps/web/src/app/globals.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/src/app/(public)/page.tsx" "apps/web/src/app/(public)/layout.tsx" apps/web/src/components/layout/public-nav.tsx apps/web/src/app/globals.css
          if ! git diff --cached --quiet; then
            git commit -m "style: format Studdy public release"
            git push origin HEAD:release/studdy-approved-public-brand-20261124
          fi
