name: SC-62 format final v2 decision slice (temporary)
on:
  pull_request:
    paths:
      - 'packages/database/src/repositories/tutor-application-v2-decisions.ts'
      - 'packages/database/src/repositories/tutor-application-v2-submission.ts'
      - 'packages/database/src/repositories/tutor-application-v2-approval.ts'
      - 'packages/database/src/repositories/notifications.ts'
      - 'apps/web/src/lib/tutors/review-actions.ts'
      - 'apps/web/src/components/tutors/application-v2-review.tsx'
      - '.github/workflows/sc-62-format-final-decisions.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-62/tutor-application-v2-foundation
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/src/repositories/tutor-application-v2-decisions.ts packages/database/src/repositories/tutor-application-v2-submission.ts packages/database/src/repositories/tutor-application-v2-approval.ts packages/database/src/repositories/notifications.ts apps/web/src/lib/tutors/review-actions.ts apps/web/src/components/tutors/application-v2-review.tsx
      - name: Commit exact project formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/repositories/tutor-application-v2-decisions.ts packages/database/src/repositories/tutor-application-v2-submission.ts packages/database/src/repositories/tutor-application-v2-approval.ts packages/database/src/repositories/notifications.ts apps/web/src/lib/tutors/review-actions.ts apps/web/src/components/tutors/application-v2-review.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format v2 decisions and notifications [sc-62]"
            git push origin HEAD:sc-62/tutor-application-v2-foundation
          fi
