name: Temporary SC-117 formatting
on:
  push:
    branches: [test/sc117-security-gates]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'darshabloom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/sc117-security-gates
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped files
        run: |
          pnpm exec prettier --write apps/web/src/lib/parent/actions.security.test.ts documentation/implementation/recovery-checkpoint.md packages/database/src/integration/family-scope-rls.integration.test.ts packages/database/src/repositories/identity.ts packages/database/src/repositories/students.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/parent/actions.security.test.ts documentation/implementation/recovery-checkpoint.md packages/database/src/integration/family-scope-rls.integration.test.ts packages/database/src/repositories/identity.ts packages/database/src/repositories/students.ts
          git diff --cached --quiet || (git commit -m "style: apply Prettier to SC-117 verification files" && git push origin HEAD:test/sc117-security-gates)
