name: SC-62 formatter diagnostics (temporary)
on:
  pull_request:
    paths:
      - 'packages/domain/src/tutors/application-v2.ts'
      - 'packages/domain/src/tutors/application-v2.test.ts'
      - '.github/workflows/sc-62-format-review.yml'
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Display exact Prettier changes
        run: |
          pnpm exec prettier --write packages/domain/src/tutors/application-v2.ts packages/domain/src/tutors/application-v2.test.ts
          git diff -- packages/domain/src/tutors/application-v2.ts packages/domain/src/tutors/application-v2.test.ts
