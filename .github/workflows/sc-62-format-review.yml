name: SC-62 draft formatter diagnostics (temporary)
on:
  pull_request:
    paths:
      - 'packages/database/src/repositories/tutor-application-v2-drafts.ts'
      - '.github/workflows/sc-62-format-review.yml'
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Display exact Prettier changes
        run: |
          pnpm exec prettier --write packages/database/src/repositories/tutor-application-v2-drafts.ts
          git diff -- packages/database/src/repositories/tutor-application-v2-drafts.ts
