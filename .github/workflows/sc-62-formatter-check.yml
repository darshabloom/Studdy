name: SC-62 exact formatter check (temporary)
on:
  pull_request:
    paths:
      - 'apps/web/src/components/tutors/application-v2-wizard.tsx'
      - '.github/workflows/sc-62-formatter-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact formatting diff
        run: |
          pnpm exec prettier --write apps/web/src/components/tutors/application-v2-wizard.tsx
          git diff -- apps/web/src/components/tutors/application-v2-wizard.tsx
