name: SC-62 scoped Prettier (temporary)
on:
  pull_request:
    paths:
      - 'apps/web/src/components/tutors/application-v2-wizard.tsx'
      - '.github/workflows/sc-62-format-wizard.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-62/tutor-application-v2-foundation
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/tutors/application-v2-wizard.tsx
      - name: Commit exact formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/tutors/application-v2-wizard.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply project Prettier to review screen [sc-62]"
            git push origin HEAD:sc-62/tutor-application-v2-foundation
          fi
