name: SC-62 branch formatter (temporary)
on:
  push:
    branches:
      - sc-62/tutor-application-v2-foundation
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: sc-62/tutor-application-v2-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/app/apply/tutor/v2/page.tsx apps/web/src/components/tutors/application-v2-wizard.tsx
      - name: Commit exact project formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/apply/tutor/v2/page.tsx apps/web/src/components/tutors/application-v2-wizard.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply project Prettier formatting to v2 wizard [sc-62]"
            git push origin HEAD:sc-62/tutor-application-v2-foundation
          fi
