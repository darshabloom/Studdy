name: SC-62 header formatter diagnostics (temporary)
on:
  pull_request:
    paths:
      - 'apps/web/src/app/apply/tutor/layout.tsx'
      - '.github/workflows/sc-62-header-format-check.yml'
permissions:
  contents: read
jobs:
  show-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/src/app/apply/tutor/layout.tsx
          git diff -- apps/web/src/app/apply/tutor/layout.tsx
