name: Format gated Google OAuth slice
on:
  push:
    branches:
      - feat/google-oauth-gated-foundation-20261124
    paths:
      - .github/workflows/format-google-oauth-slice.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-oauth-gated-foundation-20261124
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/src/lib/auth/safe-next.ts apps/web/src/lib/auth/safe-next.test.ts apps/web/src/app/auth/google/route.ts apps/web/src/components/auth/google-sign-in.tsx "apps/web/src/app/(auth)/sign-in/page.tsx" "apps/web/src/app/(auth)/sign-up/page.tsx" apps/web/src/app/auth/callback/route.ts apps/web/e2e/auth-routes.spec.ts documentation/engineering/google-oauth-release-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web documentation/engineering/google-oauth-release-gate.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format gated OAuth foundation"
            git push origin HEAD:feat/google-oauth-gated-foundation-20261124
          fi
